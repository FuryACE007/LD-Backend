version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: lucid-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_NAME}']
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s

  node-app:
    container_name: lucid-backend-service
    restart: unless-stopped
    build:
      context: ./
    environment:
      - RPC_ENDPOINT=${RPC_ENDPOINT}
      - PAYER_MNEMONIC=${PAYER_MNEMONIC}
      - NODE_ENV=${NODE_ENV}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

  escrow-app:
    container_name: escrow-service
    restart: unless-stopped
    build:
      context: ./
    environment:
      - RPC_ENDPOINT=${RPC_ENDPOINT}
      - PAYER_MNEMONIC=${PAYER_MNEMONIC}
      - NODE_ENV=${NODE_ENV}
      - ESCROW_PORT=${ESCROW_PORT:-3002}
    command: ["node", "dist/escrow/main.escrow.js"]
    ports:
      - '3002:3002'
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy/caddy:2.2.1-alpine
    container_name: caddy-service
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - $PWD/Caddyfile:/etc/caddy/Caddyfile
      - $PWD/site:/srv
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - node-app
      - escrow-app

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
