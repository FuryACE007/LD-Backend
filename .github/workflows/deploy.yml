name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main # Change this to your branch name if different

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.HOST_SSH_KEY }}

      - name: Deploy application
        env:
          PAT: ${{ secrets.PAT }}
          HOST_IP: ${{ secrets.HOST_IP }}
        run: |
          ssh -o StrictHostKeyChecking=no root@$HOST_IP 'cd /var/www/smart-supply-system-backendV1 && bash deploy.sh $PAT'
